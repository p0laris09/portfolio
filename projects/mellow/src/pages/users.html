  <script>

      { id: 8, name: "David Mendoza", email: "d.mendoza@umak.edu.ph", status: "Active", regDate: "2025-12-08", lastLogin: "2026-01-20", college: "College of Business Administration", program: "BS Business Administration", tasks: 41, spaces: 3 },
      { id: 9, name: "Ella Rodriguez", email: "e.rodriguez@umak.edu.ph", status: "Active", regDate: "2025-12-05", lastLogin: "2026-01-18", college: "College of Computer Studies", program: "BS Computer Science", tasks: 55, spaces: 4 },
      { id: 10, name: "Roberto Cruz", email: "r.cruz@umak.edu.ph", status: "Active", regDate: "2025-12-01", lastLogin: "2026-01-17", college: "College of Engineering", program: "BS Mechanical Engineering", tasks: 33, spaces: 2 },

      { id: 12, name: "Marco Villanueva", email: "m.villanueva@umak.edu.ph", status: "Inactive", regDate: "2025-11-25", lastLogin: "2025-12-15", college: "College of Computer Studies", program: "BS Information Technology", tasks: 12, spaces: 1 },
      { id: 13, name: "Bianca Tan", email: "b.tan@umak.edu.ph", status: "Active", regDate: "2025-11-22", lastLogin: "2026-01-20", college: "College of Nursing", program: "BS Nursing", tasks: 62, spaces: 4 },
      { id: 14, name: "Rafael Santos", email: "r.santos@umak.edu.ph", status: "Active", regDate: "2025-11-20", lastLogin: "2026-01-19", college: "College of Business Administration", program: "BS Accountancy", tasks: 37, spaces: 2 },
      { id: 15, name: "Carmen Reyes", email: "c.reyes@umak.edu.ph", status: "Active", regDate: "2025-11-18", lastLogin: "2026-01-18", college: "College of Computer Studies", program: "BS Computer Science", tasks: 44, spaces: 3 },

      { id: 17, name: "Lucia Gonzales", email: "l.gonzales@umak.edu.ph", status: "Active", regDate: "2025-11-12", lastLogin: "2026-01-17", college: "College of Education", program: "Bachelor of Secondary Education", tasks: 51, spaces: 3 },
      { id: 18, name: "Fernando Ramos", email: "f.ramos@umak.edu.ph", status: "Active", regDate: "2025-11-10", lastLogin: "2026-01-16", college: "College of Arts and Sciences", program: "BA Political Science", tasks: 28, spaces: 2 },
      { id: 19, name: "Gloria Castro", email: "g.castro@umak.edu.ph", status: "Active", regDate: "2025-11-08", lastLogin: "2026-01-15", college: "College of Computer Studies", program: "BS Information Technology", tasks: 59, spaces: 4 },
      { id: 20, name: "Eduardo Navarro", email: "e.navarro@umak.edu.ph", status: "Inactive", regDate: "2025-11-05", lastLogin: "2025-12-10", college: "College of Business Administration", program: "BS Marketing Management", tasks: 9, spaces: 1 },
      { id: 21, name: "Rosa Mendez", email: "r.mendez@umak.edu.ph", status: "Active", regDate: "2025-11-02", lastLogin: "2026-01-14", college: "College of Nursing", program: "BS Nursing", tasks: 42, spaces: 3 },
      { id: 22, name: "Pablo Aquino", email: "p.aquino@umak.edu.ph", status: "Active", regDate: "2025-10-30", lastLogin: "2026-01-13", college: "College of Engineering", program: "BS Electronics Engineering", tasks: 35, spaces: 2 },
      { id: 23, name: "Diana Reyes", email: "d.reyes@umak.edu.ph", status: "Active", regDate: "2025-10-28", lastLogin: "2026-01-12", college: "College of Computer Studies", program: "BS Computer Science", tasks: 58, spaces: 4 },
      { id: 24, name: "Luis Bautista", email: "l.bautista@umak.edu.ph", status: "Active", regDate: "2025-10-25", lastLogin: "2026-01-11", college: "College of Arts and Sciences", program: "BS Biology", tasks: 31, spaces: 2 },
      { id: 25, name: "Teresa Morales", email: "t.morales@umak.edu.ph", status: "Inactive", regDate: "2025-10-22", lastLogin: "2025-11-30", college: "College of Education", program: "Bachelor of Elementary Education", tasks: 6, spaces: 1 }
    ];

    let filteredData = [...usersData];
    let currentPage = 1;

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; filterAndSort(); });
    document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; filterAndSort(); });
    document.getElementById('sortBy').addEventListener('change', filterAndSort);
    document.getElementById('rowsPerPage').addEventListener('change', () => { currentPage = 1; renderTable(); });

    // Initialize
    document.addEventListener('DOMContentLoaded', filterAndSort);

    function filterAndSort() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const sortBy = document.getElementById('sortBy').value;

      // Filter
      filteredData = usersData.filter(user => {
        const matchSearch = user.name.toLowerCase().includes(searchTerm) || 
                           user.email.toLowerCase().includes(searchTerm) ||
                           user.college.toLowerCase().includes(searchTerm) ||
                           user.program.toLowerCase().includes(searchTerm);
        const matchStatus = !statusFilter || user.status === statusFilter;
        return matchSearch && matchStatus;
      });

      // Sort
      const [field, direction] = sortBy.split('-');
      filteredData.sort((a, b) => {
        let valA = a[field];
        let valB = b[field];
        
        if (field === 'regDate' || field === 'lastLogin') {
          valA = new Date(valA);
          valB = new Date(valB);
        } else {
          valA = valA.toLowerCase();
          valB = valB.toLowerCase();
        }
        
        if (direction === 'asc') {
          return valA > valB ? 1 : -1;
        } else {
          return valA < valB ? 1 : -1;
        }
      });

      renderTable();
    }

    function renderTable() {
      const rowsPerPage = parseInt(document.getElementById('rowsPerPage').value);
      const totalPages = Math.ceil(filteredData.length / rowsPerPage);
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = filteredData.slice(start, end);

      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      pageData.forEach((user, index) => {
        const row = document.createElement('tr');
        row.className = 'clickable-row';
        row.onclick = () => viewUser(user.id);
        row.innerHTML = `
          <td>${start + index + 1}</td>
          <td><strong>${user.name}</strong></td>
          <td>${user.email}</td>
          <td>${user.college}</td>
          <td>${user.program}</td>
          <td><span class="status-badge status-${user.status.toLowerCase()}">${user.status}</span></td>
          <td>${formatDate(user.regDate)}</td>
          <td>${formatDate(user.lastLogin)}</td>
        `;
        tbody.appendChild(row);
      });

      // Update showing info
      document.getElementById('showingInfo').textContent = 
        `Showing ${start + 1}-${Math.min(end, filteredData.length)} of ${filteredData.length}`;

      // Render pagination
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      // Previous button
      const prevLi = document.createElement('li');
      prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
      prevLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">Previous</a>`;
      pagination.appendChild(prevLi);

      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          const li = document.createElement('li');
          li.className = `page-item ${i === currentPage ? 'active' : ''}`;
          li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>`;
          pagination.appendChild(li);
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          const li = document.createElement('li');
          li.className = 'page-item disabled';
          li.innerHTML = '<span class="page-link">...</span>';
          pagination.appendChild(li);
        }
      }

      // Next button
      const nextLi = document.createElement('li');
      nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
      nextLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">Next</a>`;
      pagination.appendChild(nextLi);
    }

    function goToPage(page) {
      const rowsPerPage = parseInt(document.getElementById('rowsPerPage').value);
      const totalPages = Math.ceil(filteredData.length / rowsPerPage);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderTable();
      }
    }

    function viewUser(userId) {
      const user = usersData.find(u => u.id === userId);
      if (!user) return;

      const modalBody = document.getElementById('userModalBody');
      modalBody.innerHTML = `
        <div class="row">
          <div class="col-md-6">
            <h6 class="text-muted">Personal Information</h6>
            <p><strong>Name:</strong> ${user.name}</p>
            <p><strong>Email:</strong> ${user.email}</p>
            <p><strong>Status:</strong> <span class="status-badge status-${user.status.toLowerCase()}">${user.status}</span></p>
          </div>
          <div class="col-md-6">
            <h6 class="text-muted">Academic Information</h6>
            <p><strong>College:</strong> ${user.college}</p>
            <p><strong>Program:</strong> ${user.program}</p>
          </div>
        </div>
        <hr>
        <div class="row">
          <div class="col-md-6">
            <h6 class="text-muted">Activity</h6>
            <p><strong>Registered:</strong> ${formatDate(user.regDate)}</p>
            <p><strong>Last Login:</strong> ${formatDate(user.lastLogin)}</p>
          </div>
          <div class="col-md-6">
            <h6 class="text-muted">Statistics</h6>
            <p><strong>Total Tasks:</strong> ${user.tasks}</p>
            <p><strong>Total Spaces:</strong> ${user.spaces}</p>
          </div>
        </div>
      `;

      new bootstrap.Modal(document.getElementById('userModal')).show();
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function exportToCSV() {
      const headers = ['Name', 'Email', 'College', 'Program', 'Status', 'Registered', 'Last Login'];
      const rows = filteredData.map(user => [
        user.name,
        user.email,
        user.college,
        user.program,
        user.status,
        user.regDate,
        user.lastLogin
      ]);

      let csvContent = headers.join(',') + '\n';
      rows.forEach(row => {
        csvContent += row.map(cell => `"${cell}"`).join(',') + '\n';
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'mellow_users.csv';
      link.click();
    }

    function exportToExcel() {
      const data = [
        ['Name', 'Email', 'College', 'Program', 'Status', 'Registered', 'Last Login'],
        ...filteredData.map(user => [
          user.name,
          user.email,
          user.college,
          user.program,
          user.status,
          user.regDate,
          user.lastLogin
        ])
      ];

      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Users');
      XLSX.writeFile(wb, 'mellow_users.xlsx');
    }
  </script>
</body>
