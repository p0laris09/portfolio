            <header class="site-header section-padding d-flex justify-content-center align-items-center">

                    <div class="row">

                        <div class="col-lg-10 col-12">

                                <span class="d-block text-dark">Reservation Form</span>

            <body>
                
                <div class="demo-notice">
                    <i class="bi bi-info-circle"></i>
                    <strong>Demo Mode:</strong> This is a frontend demonstration. Form submissions are disabled.
                </div>
                
                <form class="hotel-reservation-form" onsubmit="return false;">
                    <div class="fields">
                        <div class="wrapper">
                            <div>
                                <label for="first_name">First Name</label>
                                <div class="field">
                                    <i class="fas fa-user"></i>
                                    <input id="first_name" type="text" name="first_name" placeholder="First Name">
                                </div>
                            </div>
                            <div class="gap"></div>
                            <div>
                                <label for="last_name">Last Name</label>
                                <div class="field">
                                    <i class="fas fa-user"></i>
                                    <input id="last_name" type="text" name="last_name" placeholder="Last Name">
                                </div>
                            </div>
                        </div>

                        <div class="wrapper">
                            <div>
                                <label for="arrival">Arrival</label>
                                    <div class="field">
                                        <input id="arrival" type="date" name="arrival">
                                    </div>
                            </div>
                            <div class="gap"></div>
                                <div>
                                    <label for="departure">Departure</label>
                                        <div class="field">
                                            <input id="departure" type="date" name="departure">
                                        </div>
                                </div>
                            </div>

                        <div class="wrapper">
                            <div>
                                <label for="email">Email</label>
                                <div class="field">
                                    <i class="fas fa-user"></i>
                                    <input id="email" type="text" name="email" placeholder="Your Email">
                                </div>
                            </div>
                            <div class="gap"></div>
                            <div>
                                <label for="phone">Contact Number</label>
                                <div class="field">
                                    <i class="fas fa-user"></i>
                                    <input id="phone" type="tel" name="phone" placeholder="09">
                                </div>
                            </div>
                        </div>

                        <div class = "wrapper">
                            <div>
                                    <label for="room_pref">Room Preference</label>
                                    <div class="field">
                                        <select id="room_pref" name="room_pref">
                                            <option disabled selected value="">--</option>
                                            <option value="Standard">Standard</option>
                                            <option value="Deluxe">Deluxe</option>
                                            <option value="Suite">Suite</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="gap"></div>
                                <div>
                                    <label for="room_cap">Room Capacity</label>
                                    <div class="field">
                                        <select id="room_cap" name="room_cap">
                                            <option disabled selected value="">--</option>
                                            <option value="Single">Single</option>
                                            <option value="Double">Double</option>
                                            <option value="Family">Family</option>
                                        </select>
                                    </div>
                                </div>
                        </div>
                    

                        <div class = "wrapper">
                            <div>
                                <label for="top">Type of Payment</label>
                                <div class="field">
                                <select id="top" name="top">
                                    <option disabled selected value="">--</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Check">Check</option>
                                    <option value="Credit Card">Credit Card</option>
                                </select>
                            </div>
                            </div>
                            
                            
                        </div>
                        


                        
                        <div id="error-message" style="color: red;"></div>
                        <div class="gap"></div>
                        <div class="gap"></div>
                            <button type="button" onclick="alert('This is a demo. Reservations are not processed.')">Reserve (Demo)</button>
                            <button type="reset">Clear</button>
                        </div>
                    </div>
                    </div>
                </form>
